<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 - 공모전 투표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo',sans-serif;background:#f0f4f8;min-height:100vh}
header{background:#1a3d5c;color:white;padding:16px 20px;display:flex;align-items:center;gap:12px}
header a{color:white;text-decoration:none;font-size:20px}
header h1{font-size:17px;font-weight:600}

/* 로그인 */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;padding:20px}
.login-box{background:white;border-radius:14px;padding:32px 28px;width:100%;max-width:340px;text-align:center;border:1px solid #e0e8f0}
.login-box h2{font-size:17px;font-weight:600;margin-bottom:20px;color:#333}
.login-box input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:15px;text-align:center;letter-spacing:6px;margin-bottom:12px}
.login-box button{width:100%;padding:11px;background:#1a3d5c;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}

/* 대시보드 */
.dash{display:none;padding:16px}
.dash.show{display:block}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.top-bar h2{font-size:16px;font-weight:600;color:#333}
.btn-group{display:flex;gap:8px}
.btn{padding:8px 14px;border-radius:7px;font-size:13px;cursor:pointer;border:1px solid #ddd;background:white}
.btn-primary{background:#1a3d5c;color:white;border-color:#1a3d5c}
.btn-danger{color:#c62828;border-color:#ef9a9a}
.btn-green{background:#2e7d32;color:white;border-color:#2e7d32}

/* 필터 */
.filter-bar{background:white;border-radius:10px;padding:12px 16px;margin-bottom:14px;border:1px solid #e0e8f0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filter-bar label{font-size:13px;color:#666}
.filter-bar select{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}

/* 요약 카드 */
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:white;border-radius:10px;padding:14px;border:1px solid #e0e8f0;text-align:center}
.stat-card .val{font-size:26px;font-weight:700;color:#1a3d5c}
.stat-card .lbl{font-size:12px;color:#888;margin-top:2px}

/* 순위 */
.rank-section{background:white;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #e0e8f0}
.rank-section h3{font-size:14px;font-weight:600;margin-bottom:14px;color:#333}
.rank-item{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rank-no{font-size:15px;font-weight:700;color:#1a3d5c;min-width:26px}
.rank-thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#eee;border:1px solid #e0e8f0;cursor:pointer}
.rank-info{flex:1}
.rank-title{font-size:13px;font-weight:600;color:#333}
.rank-bar-wrap{height:7px;background:#f0f0f0;border-radius:4px;margin-top:4px}
.rank-bar{height:100%;background:#1a3d5c;border-radius:4px;transition:width .6s}
.rank-count{font-size:13px;font-weight:600;color:#1a3d5c;min-width:60px;text-align:right}

/* 참여자 테이블 */
.table-section{background:white;border-radius:12px;padding:16px;border:1px solid #e0e8f0}
.table-section h3{font-size:14px;font-weight:600;margin-bottom:12px;color:#333}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
th{background:#1a3d5c;color:white;padding:9px 12px;text-align:left;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f0f0f0}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}

/* 라이트박스 */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:90vh;border-radius:8px;object-fit:contain}
.lb-close{position:fixed;top:16px;right:20px;color:white;font-size:28px;cursor:pointer}
.lb-num{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:white;font-size:13px;background:rgba(0,0,0,.5);padding:5px 14px;border-radius:20px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:300}
.toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:#888;font-size:14px}
</style>
</head>
<body>

<header>
  <a href="index.html">←</a>
  <h1>🔐 관리자 페이지</h1>
</header>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h2>관리자 로그인</h2>
    <input type="password" id="pwInput" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">로그인</button>
  </div>
</div>

<div class="dash" id="dash">
  <div class="top-bar">
    <h2>📊 투표 현황</h2>
    <div class="btn-group">
      <button class="btn" onclick="loadData()">🔄 새로고침</button>
      <button class="btn btn-green" onclick="exportCSV()">CSV 저장</button>
      <button class="btn btn-danger" onclick="clearAll()">초기화</button>
    </div>
  </div>

  <div class="filter-bar">
    <label>학년 필터</label>
    <select id="gradeFilter" onchange="applyFilter()">
      <option value="">전체</option>
      <option>1학년</option><option>2학년</option><option>3학년</option>
      <option>4학년</option><option>5학년</option><option>6학년</option>
    </select>
    <label style="margin-left:8px">정렬</label>
    <select id="sortBy" onchange="applyFilter()">
      <option value="votes">득표순</option>
      <option value="num">번호순</option>
    </select>
  </div>

  <div class="summary" id="summary"></div>
  <div class="rank-section">
    <h3>🥇 출품작 순위</h3>
    <div id="rankList"><div class="loading">데이터 불러오는 중...</div></div>
  </div>
  <div class="table-section">
    <h3>📋 참여자 목록 (<span id="voterCount">0</span>명)</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>학년</th><th>반</th><th>이름</th><th>선택 작품</th><th>투표 시간</th></tr></thead>
        <tbody id="voterBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="lb" id="lb" onclick="if(event.target===this)closeLB()">
  <span class="lb-close" onclick="closeLB()">✕</span>
  <img id="lbImg" src="" alt="">
  <span class="lb-num" id="lbNum"></span>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxNr4nN2IIa4eBJJtSEYoFC81mHLT9MtPg_IV7j_E3AMRjrVQVWYKQ65ERUl1jt1xjj/exec'; // ★ 여기에 URL 입력
const FILES = [
  '로고 공모전 (1).jpeg','로고 공모전 (1).jpg','로고 공모전 (1).png',
  '로고 공모전 (2).jpeg','로고 공모전 (2).jpg','로고 공모전 (2).png',
  '로고 공모전 (3).jpg','로고 공모전 (3).png',
  '로고 공모전 (4).jpg','로고 공모전 (4).png',
  '로고 공모전 (5).jpg','로고 공모전 (5).png',
  '로고 공모전 (6).png','로고 공모전 (7).png','로고 공모전 (8).png',
  '로고 공모전 (9).png','로고 공모전 (10).png','로고 공모전 (11).png',
  '로고 공모전 (12).png','로고 공모전 (13).png','로고 공모전 (14).png',
  '로고 공모전 (15).png','로고 공모전 (16).png','로고 공모전 (17).png',
  '로고 공모전 (18).png','로고 공모전 (19).png','로고 공모전 (20).png',
  '로고 공모전 (21).png','로고 공모전 (22).png','로고 공모전 (23).png',
  '로고 공모전 (24).png','로고 공모전 (25).png','로고 공모전 (26).png',
  '로고 공모전 (27).png','로고 공모전 (28).png','로고 공모전 (29).png'
];
const TOTAL = FILES.length;
let pw = '';
let allVotes = [];
let filteredVotes = [];

function login() {
  pw = document.getElementById('pwInput').value;
  if(!pw){showToast('비밀번호를 입력하세요');return;}
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('dash').classList.add('show');
  loadData();
}

async function loadData() {
  document.getElementById('rankList').innerHTML='<div class="loading">데이터 불러오는 중...</div>';
  try {
    const r = await api({action:'getResults', pw});
    if(!r.success){showToast(r.msg||'오류');return;}
    allVotes = r.votes;
    applyFilter();
  } catch(e){showToast('서버 연결 오류');}
}

function applyFilter() {
  const gf = document.getElementById('gradeFilter').value;
  const sb = document.getElementById('sortBy').value;
  filteredVotes = gf ? allVotes.filter(v=>v.grade===gf) : [...allVotes];
  renderDash(filteredVotes, sb);
}

function renderDash(votes, sortBy) {
  const total = votes.length;
  // 학년별 집계
  const byGrade = {};
  [1,2,3,4,5,6].forEach(g=>byGrade[g+'학년']=0);
  votes.forEach(v=>{ if(byGrade[v.grade]!==undefined) byGrade[v.grade]++; });

  // 요약
  const sumEl = document.getElementById('summary');
  sumEl.innerHTML = `<div class="stat-card"><div class="val">${total}</div><div class="lbl">총 투표수</div></div>`
    + Object.entries(byGrade).map(([g,c])=>`<div class="stat-card"><div class="val">${c}</div><div class="lbl">${g}</div></div>`).join('');

  // 작품별 집계
  const counts = {};
  for(let i=1;i<=TOTAL;i++) counts[i]=0;
  votes.forEach(v=>{
    const n = parseInt(v.work.replace('No.',''));
    if(n>=1&&n<=TOTAL) counts[n]++;
  });

  let entries = Object.entries(counts);
  if(sortBy==='votes') entries.sort((a,b)=>b[1]-a[1]);
  else entries.sort((a,b)=>a[0]-b[0]);

  const maxC = Math.max(...entries.map(e=>e[1]),1);
  document.getElementById('rankList').innerHTML = entries.map(([num,cnt],i)=>`
    <div class="rank-item">
      <div class="rank-no">${sortBy==='votes'?i+1:'—'}</div>
      <img class="rank-thumb" id="rthumb${num}"
           onclick="openLB(${num-1})" title="크게 보기">
      <div class="rank-info">
        <div class="rank-title">No.${String(num).padStart(2,'0')}</div>
        <div class="rank-bar-wrap"><div class="rank-bar" style="width:${Math.round(cnt/maxC*100)}%"></div></div>
      </div>
      <div class="rank-count">${cnt}표${total?` (${Math.round(cnt/total*100)}%)`:''}</div>
    </div>`).join('');

  // 참여자 목록
  entries.forEach(([num])=>{
    const el=document.getElementById('rthumb'+num);
    if(el) setImg(el, num-1);
  });
  document.getElementById('voterBody').innerHTML = votes.length
    ? votes.map((v,i)=>`<tr><td>${i+1}</td><td>${v.grade}</td><td>${v.classNum}</td><td>${v.name}</td><td>${v.work}</td><td>${v.time}</td></tr>`).join('')
    : '<tr><td colspan="6" style="text-align:center;color:#aaa;padding:20px">투표 데이터 없음</td></tr>';
}

function imgSrc(i) { return `images/${encodeURIComponent(FILES[i])}`; }
function setImg(el, i) { el.src = imgSrc(i); el.onerror=()=>el.style.background='#eee'; }
function openLB(i) {
  document.getElementById('lbImg').src = imgSrc(i);
  document.getElementById('lbNum').textContent=`No.${String(i+1).padStart(2,'0')}`;
  document.getElementById('lb').classList.add('open');
}
function closeLB(){document.getElementById('lb').classList.remove('open');}

function exportCSV() {
  if(!allVotes.length){showToast('투표 데이터가 없습니다');return;}
  const rows=[['번호','학년','반','이름','선택작품','투표시간'],
    ...allVotes.map((v,i)=>[i+1,v.grade,v.classNum,v.name,v.work,v.time])];
  const csv='\uFEFF'+rows.map(r=>r.join(',')).join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='공모전투표결과.csv';a.click();
}

async function clearAll() {
  if(!confirm('모든 투표 데이터를 초기화할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
  try {
    const r=await api({action:'clearVotes',pw});
    if(r.success){allVotes=[];applyFilter();showToast('초기화 완료');}
    else showToast(r.msg||'오류');
  } catch(e){showToast('서버 연결 오류');}
}

async function api(body) {
  const params = new URLSearchParams(body);
  const r = await fetch(API_URL + '?' + params.toString());
  return r.json();
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
